<style>/* AyahFlow — charcoal and gold, set like an illuminated mushaf.
   Every colour is a token. Dark is the approved default palette; light ("vellum") is the same family.
   Tint colours use `rgb(var(--tint) / alpha)` (no color-mix) so older WebViews render them. */
:root{color-scheme:dark;

--ikhfa:#bea1d4;--ikhfa-mark:#d1b1e8;--ghunnah:#d9bb79;--ghunnah-mark:#efd69f;--qalqalah:#e3a996;--qalqalah-mark:#eebcac;--madd:#92b3cc;--madd-mark:#acd0eb;

--bg:#f7f5ee;--bg-rgb:247 245 238;--bg-deep:#dddacb;--panel:#fffdf8;--panel2:#f0ece1;--raise:#f1ebdc;--line:#dcd6c6;--line-strong:#bbaa81;--track:#e3e0d3;
--gold:#79591f;--gold-bright:#664719;--tint:168 131 62;--on-gold:#221c0f;--gold-fill:linear-gradient(120deg,#e8cd8f,#c19a52);--gold-edge:#b8944f;
--text:#25291f;--muted:#555d50;--soft:#687062;--green:#346547;--green-rgb:52 101 71;--warning:#845429;--warning-rgb:132 84 41;--red:#9a4235;--red-rgb:154 66 53;
--card-fill:linear-gradient(145deg,#fffdf8,#f3efe5);--hero-fill:linear-gradient(130deg,#f5eedd,#ece6d5);--hero-line:#c9b68a;--nav-bg:rgb(255 253 248 / .94);--shadow:0 4px 30px rgb(54 48 38 / .14);--glow:0 0 40px rgb(168 131 62 / .08);
--ikhfa:#8a5fae;--ikhfa-mark:#673f80;--ghunnah:#a8833e;--ghunnah-mark:#755414;--qalqalah:#b8674f;--qalqalah-mark:#96503b;--madd:#4f7fa3;--madd-mark:#315f81}

*{box-sizing:border-box}html{height:100%;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}

.gold{color:var(--gold)}.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}.serif{font-family:var(--serif)}.eyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);font-weight:600}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}.gap8{gap:8px}.mt12{margin-top:12px}.mt20{margin-top:20px}.mt28{margin-top:28px}.mb16{margin-bottom:16px}.grow{flex:1;min-width:0}.center{text-align:center}

/* Shell */

.icon-button{height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;color:var(--muted);transition:color .2s,border-color .2s,background .2s}.icon-button:hover{color:var(--gold)}.icon-button.active{border-color:var(--gold);color:var(--gold);background:rgb(var(--tint) / .1)}

.bottom-nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--nav-bg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 12px calc(12px + var(--safe-bottom))}

.hero{position:relative;min-height:220px;display:flex;flex-direction:column;justify-content:center;isolation:isolate;padding-bottom:15px}.hero h1{font:36px/1.2 var(--serif);letter-spacing:-1px;max-width:285px}.hero h1 em{color:var(--gold-bright)}.hero p{font-size:13px;max-width:215px;color:var(--muted);margin-top:13px;line-height:1.6}.hero .eyebrow{margin-bottom:16px;font-size:10px}
.arch-art{position:absolute;width:200px;height:245px;right:-14px;top:-4px;z-index:-1;opacity:.85;pointer-events:none}html[data-theme=light] .arch-art{opacity:1;filter:saturate(1.3) brightness(.62)}

.today-card:after{content:'';position:absolute;width:130px;height:130px;right:-85px;top:-75px;border:1px solid rgb(var(--tint) / .14);transform:rotate(45deg);pointer-events:none}
.round-icon{height:43px;width:43px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgb(var(--tint) / .28);color:var(--gold);background:rgb(var(--tint) / .05)}
.today-card h2{font:25px/1.25 var(--serif)}.today-card .description{font-size:13px;color:var(--muted);margin:11px 0 17px;max-width:290px}
.plan-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:19px}.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgb(var(--tint) / .04);border:1px solid var(--line);border-radius:8px;padding:5px 9px;color:var(--muted);font-variant-numeric:tabular-nums}.pill.gold{color:var(--gold);border-color:rgb(var(--tint) / .3);background:rgb(var(--tint) / .06)}.pill.success{color:var(--green);border-color:rgb(var(--green-rgb) / .35)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;border-radius:13px;padding:12px 18px;font-weight:600;font-size:14px;line-height:1.4;transition:background .2s,transform .15s,box-shadow .2s,border-color .2s;text-decoration:none}.button:active:not(:disabled){transform:scale(.98)}

/* Library and reader */
.search-box{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:17px;color:var(--muted)}.search-box:focus-within{border-color:rgb(var(--tint) / .6)}.search-box input{background:none;border:0;outline:0;color:var(--text);width:100%;font-size:14px;min-height:29px}
.segment{display:flex;gap:3px;border:1px solid var(--line);border-radius:11px;padding:4px;background:var(--panel);margin-bottom:18px}.segment button{flex:1;min-height:38px;color:var(--muted);font-size:12px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s}.segment button.active{background:rgb(var(--tint) / .16);color:var(--gold);font-weight:600}
.surah-row{width:100%;display:flex;align-items:center;gap:13px;padding:18px 0;border-bottom:1px solid var(--line);text-align:start}.surah-row h3{font:19px var(--serif)}.surah-row .arabic{font-size:calc(25px * var(--ar));color:var(--gold-bright)}.surah-row p{font-size:12px;color:var(--muted);margin-top:4px}
.surah-number{height:38px;width:38px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:12px;flex-shrink:0;font-variant-numeric:tabular-nums}.surah-number:before,.surah-number:after{content:'';position:absolute;inset:6px;border:1px solid rgb(var(--tint) / .45);border-radius:3px;transform:rotate(45deg)}.surah-number:after{transform:rotate(0)}
.reader-heading{padding:14px 0 22px;text-align:center}.reader-heading h1{font:24px var(--serif);margin-top:6px}
.cartouche{display:grid;place-items:center;max-width:360px;margin:14px auto 4px;color:var(--gold)}.cartouche>*{grid-area:1/1}.cartouche svg{width:100%;height:auto}.cartouche .arabic{font-size:calc(31px * var(--ar));line-height:1.2;color:var(--gold-bright);text-align:center;padding-bottom:3px}
.f-fill{fill:rgb(var(--tint) / .07);stroke:currentColor;stroke-width:1.2}.f-line{fill:none;stroke:currentColor;stroke-opacity:.45;stroke-width:.7}.f-star{fill:rgb(var(--tint) / .22);stroke:currentColor;stroke-width:.9}.f-dot{fill:currentColor}
.ayah-card{padding:20px 0;border-top:1px solid var(--line)}.ayah-meta{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}.ayah-tools{display:flex;gap:2px}.ayah-tools .icon-button{height:40px;min-width:40px;border:0}.ayah-tools .icon-button svg{width:18px;height:18px}
.ayah-text{font-size:calc(29px * var(--ar));line-height:2.15;padding:6px 0}.text-link{font-size:12px;min-height:44px;display:inline-flex;align-items:center;gap:4px;color:var(--gold)}
/* Ayah-end medallion: metadata set beside the source text, never inside the string */
.ayah-end{display:inline-grid;place-items:center;width:1.2em;height:1.2em;vertical-align:-.28em;margin-inline:.08em;color:var(--gold);line-height:1}.ayah-end>*{grid-area:1/1}.ayah-end svg{width:100%;height:100%}.ayah-end>span{font:600 .4em/1 var(--ui);color:var(--gold-bright);font-variant-numeric:tabular-nums}
.m-fill{fill:rgb(var(--tint) / .1);stroke:currentColor;stroke-width:1.3}.m-line{fill:none;stroke:currentColor;stroke-width:.8;opacity:.55}
.mushaf-page{padding:22px 18px 18px;border:1px solid rgb(var(--tint) / .45);border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px rgb(var(--tint) / .28),var(--glow)}
.flow-text{font-size:calc(27px * var(--ar));line-height:2.35;text-align:justify;text-align-last:center}.flow-ayah{scroll-margin-top:100px}

/* Session */
.question-progress{height:4px;background:var(--track);border-radius:5px;margin-bottom:28px;overflow:hidden}.question-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold-bright),var(--gold));transition:width .35s}
.question-title{font:29px/1.2 var(--serif);text-align:center;margin:10px 0}.question-sub{text-align:center;font-size:13px;color:var(--muted);margin:8px 0 16px}
.play-region{display:flex;justify-content:center;align-items:center;gap:16px;height:90px}.play-circle{width:66px;height:66px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold-bright);background:radial-gradient(circle,rgb(var(--tint) / .12),transparent);box-shadow:var(--glow)}.play-circle svg{width:26px;height:26px}
.wave{display:flex;align-items:center;gap:3px;height:40px;opacity:.6}.wave i{width:2px;border-radius:1px;background:var(--gold);height:var(--h)}.audio-playing .wave i{animation:wave .85s ease-in-out infinite alternate;animation-delay:var(--delay)}
.question-ayah{border:1px solid var(--line);border-radius:var(--radius);background:var(--card-fill);padding:20px;margin:14px 0 20px;position:relative}.question-ayah:before{content:'';position:absolute;inset:5px;border:1px solid rgb(var(--tint) / .12);border-radius:13px;pointer-events:none}
.question-ayah .arabic{font-size:calc(27px * var(--ar));text-align:center;line-height:2}.question-ayah .verse-key{text-align:center;color:var(--muted);font-size:12px;margin-top:8px;letter-spacing:.6px}
.options{display:flex;flex-direction:column;gap:10px}.option{display:flex;gap:13px;align-items:center;padding:12px 16px;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--panel);width:100%;min-height:64px;transition:border-color .2s,background .2s}
.option-letter{width:28px;height:28px;border-radius:50%;background:var(--track);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:var(--muted)}.option .arabic{font-size:calc(23px * var(--ar));line-height:1.8;flex:1}
.option.selected{border-color:var(--gold);background:rgb(var(--tint) / .07)}.option.selected .option-letter{color:var(--gold);background:rgb(var(--tint) / .16)}.option.answer-correct{border-color:rgb(var(--green-rgb) / .55);background:rgb(var(--green-rgb) / .08)}.option.answer-wrong{border-color:rgb(var(--red-rgb) / .55);background:rgb(var(--red-rgb) / .07)}.option:disabled{opacity:1}
.question-actions{margin-top:22px}
.feedback{border-radius:var(--radius);border:1px solid rgb(var(--green-rgb) / .4);background:rgb(var(--green-rgb) / .06);padding:18px;margin-top:20px;animation:enter .3s ease-out}.feedback.wrong{border-color:rgb(var(--warning-rgb) / .45);background:rgb(var(--warning-rgb) / .06)}
.feedback h3{font:23px var(--serif);color:var(--green);margin-bottom:6px;display:flex;align-items:center;gap:8px}.feedback.wrong h3{color:var(--warning)}.feedback p{font-size:13px;color:var(--muted)}.feedback .arabic{font-size:calc(23px * var(--ar));margin:9px 0;color:var(--text)}.feedback .gold{color:var(--gold)}
